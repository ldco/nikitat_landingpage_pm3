name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality-gate:
    name: Validator + typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PM3 framework validator (full repo)
        run: npm run validate:pm3

      - name: i18n catalog validation (missing keys / blanks / raw keys / untranslated copies)
        run: npm run i18n:validate

      - name: TypeScript check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Dependency audit (audit N-3 — zod v4 / CVE watch)
        run: npm audit --audit-level=high

      - name: Production build (before tests — API tests spawn build/index.js)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: API test gate (request-level, per-file timeout)
        run: bash scripts/run-api-tests.sh
