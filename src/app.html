<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.textDirection%" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Pre-paint theme restore (PM2 parity): the stored pm-theme preference
         is applied before first paint so full page loads — including the
         admin login — keep the chosen light/dark mode. SSR baseline stays
         dark (class="dark"); a stored 'light' removes the class. The
         %sveltekit.nonce% placeholder keeps this inline script valid under
         nonce-mode CSP. -->
    <script nonce="%sveltekit.nonce%">
      (function () {
        try {
          if (localStorage.getItem('pm-theme') === 'light') {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {
          console.debug('[theme] pre-paint restore blocked:', e)
        }
      })()
    </script>
    <!-- Only real, shipped assets are referenced (generated by scripts/generate-favicons.mjs) -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="theme-color" content="#901504" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-prerender="true">
    <!-- WCAG 2.4.1: Skip-to-content link -->
    <a href="#main-content" class="skip-link sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-pm-brand focus:text-white focus:rounded-lg focus:text-sm focus:outline-none">
      Skip to content
    </a>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
